<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 · XEmail</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <style>
      :root {
        --bg: #f5f6f8;
        --surface: #ffffff;
        --surface-muted: #fafbfc;
        --border: #e4e6eb;
        --border-strong: #d4d7dd;
        --text: #1f2328;
        --text-muted: #6b7280;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --primary-soft: #e8efff;
        --danger: #dc2626;
        --success: #16a34a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        line-height: 1.5;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        width: 380px;
        max-width: calc(100vw - 32px);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 28px 26px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.06);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
      }
      .brand .logo {
        width: 32px;
        height: 32px;
        display: block;
        flex-shrink: 0;
      }
      .brand .name { font-weight: 600; font-size: 17px; }
      h1 {
        margin: 8px 0 4px;
        font-size: 18px;
      }
      .desc {
        margin: 0 0 18px;
        color: var(--text-muted);
        font-size: 12.5px;
      }
      .tabs {
        display: flex;
        gap: 4px;
        margin-bottom: 14px;
        background: var(--surface-muted);
        padding: 3px;
        border-radius: 6px;
      }
      .tab {
        flex: 1;
        text-align: center;
        padding: 6px 0;
        border-radius: 4px;
        cursor: pointer;
        color: var(--text-muted);
        user-select: none;
        font-size: 13px;
      }
      .tab.active {
        background: var(--surface);
        color: var(--text);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
      }
      .field { display: flex; flex-direction: column; margin-bottom: 12px; }
      .field label {
        font-size: 12px;
        color: var(--text-muted);
        margin-bottom: 4px;
      }
      .field input {
        padding: 9px 11px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font: inherit;
        background: var(--surface);
        color: var(--text);
      }
      .field input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--primary-soft);
      }
      .btn-primary {
        display: block;
        width: 100%;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid var(--primary);
        background: var(--primary);
        color: #fff;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
        margin-top: 4px;
      }
      .btn-primary:hover { background: var(--primary-hover); }
      .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
      /* Modal button variants — no block/full-width like .btn-primary */
      #pw_reset_overlay .btn-primary,
      #pw_reset_overlay .btn-secondary {
        display: inline-block;
        width: auto;
        min-width: 96px;
        margin-top: 0;
      }
      .btn-secondary {
        padding: 10px 14px;
        border-radius: 6px;
        border: 1px solid #d1d5db;
        background: #fff;
        color: #374151;
        font: inherit;
        cursor: pointer;
      }
      .btn-secondary:hover { background: #f9fafb; }
      .btn-secondary:disabled { opacity: 0.6; cursor: not-allowed; }
      .status {
        margin-top: 12px;
        min-height: 18px;
        font-size: 13px;
      }
      .status.error { color: var(--danger); }
      .status.success { color: var(--success); }
      .hint {
        margin-top: 14px;
        font-size: 12px;
        color: var(--text-muted);
        text-align: center;
      }
    </style>
    <script src="/i18n.js"></script>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <img class="logo" src="/logo.svg" alt="XEmail" />
        <div class="name">XEmail</div>
      </div>

      <div id="mode_setup" style="display: none">
        <h1>设置管理员</h1>
        <p class="desc">系统尚未初始化，请创建第一位管理员账号。该账号将拥有全部权限。</p>
        <form id="form_setup" autocomplete="off">
          <div class="field">
            <label for="setup_username">用户名</label>
            <input id="setup_username" required minlength="3" maxlength="32" />
          </div>
          <div class="field">
            <label for="setup_password">密码（至少 6 位）</label>
            <input id="setup_password" type="password" required minlength="6" />
          </div>
          <button class="btn-primary" type="submit">创建管理员</button>
        </form>
      </div>

      <div id="mode_auth" style="display: none">
        <div class="tabs">
          <div class="tab active" data-tab="login">登录</div>
          <div class="tab" data-tab="register">注册</div>
        </div>

        <form id="form_login" autocomplete="off">
          <div class="field">
            <label for="login_username">用户名</label>
            <input id="login_username" required />
          </div>
          <div class="field">
            <label for="login_password">密码</label>
            <input id="login_password" type="password" required />
          </div>
          <button class="btn-primary" type="submit">登录</button>
          <div style="text-align:right;margin-top:8px;font-size:12px">
            <a href="#" id="link_forgot" style="color:#2563eb;text-decoration:none">
              忘记密码?
            </a>
          </div>
        </form>

        <form id="form_register" autocomplete="off" style="display: none">
          <div class="field">
            <label for="register_username">用户名（3–32 位）</label>
            <input id="register_username" required minlength="3" maxlength="32" />
          </div>
          <div class="field">
            <label for="register_password">密码（至少 6 位）</label>
            <input id="register_password" type="password" required minlength="6" />
          </div>
          <button class="btn-primary" type="submit">注册并登录</button>
        </form>
      </div>

      <div class="status" id="status"></div>
    </div>

    <!-- Forgot-password modal. Two-step flow:
         Step 1: username → server drops a code into <data_dir>/.password_reset_challenge
                 (0600). Response only names the path, never the code itself.
         Step 2: user opens the file, reads the 6-digit code, types it back
                 in with a new password. On success the modal closes and the
                 user is auto-logged-in (fresh session cookie).
         Security: local desktop app — only the OS-owner can read files inside
         the data dir. A remote attacker reaching /api/auth/password-reset/*
         over LAN can trigger creation but can't read the file to learn the
         code. -->
    <div id="pw_reset_overlay"
         style="display:none;position:fixed;inset:0;background:rgba(15,23,42,0.45);
                z-index:100;align-items:center;justify-content:center;padding:20px">
      <div style="background:#fff;border-radius:10px;max-width:520px;width:100%;
                  box-shadow:0 24px 60px rgba(15,23,42,0.25);overflow:hidden">
        <div style="padding:16px 20px;border-bottom:1px solid #e5e7eb">
          <h3 style="margin:0;font-size:16px" id="pw_reset_title">找回密码</h3>
        </div>
        <div style="padding:16px 20px">
          <!-- Step 1 -->
          <div id="pw_reset_step1">
            <p style="margin:0 0 12px;font-size:13px;color:#374151;line-height:1.55">
              XEmail 是本地桌面应用。为了确认你本人在操作,系统会把一个 6 位验证码
              写入本机数据目录中的一个文件,你打开该文件读取验证码即可。
            </p>
            <div class="field">
              <label for="pw_reset_username">用户名</label>
              <input id="pw_reset_username" style="width:100%;padding:8px;box-sizing:border-box" />
            </div>
            <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
              <button class="btn-secondary" type="button" id="pw_reset_cancel1">取消</button>
              <button class="btn-primary" type="button" id="pw_reset_request_btn">发送验证码</button>
            </div>
          </div>

          <!-- Step 2 -->
          <div id="pw_reset_step2" style="display:none">
            <p style="margin:0 0 8px;font-size:13px;color:#374151;line-height:1.55">
              验证码已写入以下文件:
            </p>
            <div id="pw_reset_path_box"
                 style="background:#f3f4f6;border:1px solid #e5e7eb;border-radius:6px;
                        padding:8px 10px;font-family:ui-monospace,monospace;font-size:12px;
                        word-break:break-all;margin-bottom:8px;display:flex;
                        justify-content:space-between;align-items:center;gap:8px">
              <span id="pw_reset_path_txt" style="flex:1;user-select:all"></span>
              <button type="button" id="pw_reset_copy_btn"
                      style="flex:none;padding:2px 8px;font-size:11px;
                             background:#fff;border:1px solid #d1d5db;border-radius:4px;
                             cursor:pointer">复制路径</button>
            </div>
            <p style="margin:0 0 12px;font-size:12px;color:#6b7280;line-height:1.55">
              请在 Finder / 文件管理器 或终端里打开该文件,读取其中的 <code>code</code> 字段
              (6 位数字),然后回到这里输入。有效期 5 分钟。
            </p>
            <div class="field">
              <label for="pw_reset_code">验证码</label>
              <input id="pw_reset_code" inputmode="numeric" pattern="[0-9]{6}"
                     placeholder="6 位数字"
                     style="width:100%;padding:8px;box-sizing:border-box;
                            font-family:ui-monospace,monospace;letter-spacing:2px" />
            </div>
            <div class="field">
              <label for="pw_reset_new_pw">新密码(至少 6 位)</label>
              <input id="pw_reset_new_pw" type="password" minlength="6"
                     style="width:100%;padding:8px;box-sizing:border-box" />
            </div>
            <div class="field">
              <label for="pw_reset_new_pw2">再输一次</label>
              <input id="pw_reset_new_pw2" type="password" minlength="6"
                     style="width:100%;padding:8px;box-sizing:border-box" />
            </div>
            <div id="pw_reset_countdown"
                 style="font-size:12px;color:#6b7280;margin-top:6px"></div>
            <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
              <button class="btn-secondary" type="button" id="pw_reset_cancel2">取消</button>
              <button class="btn-primary" type="button" id="pw_reset_complete_btn">
                重置并登录
              </button>
            </div>
          </div>

          <div id="pw_reset_status"
               style="margin-top:10px;min-height:16px;font-size:12px"></div>
        </div>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const statusEl = $("status");

      function setStatus(msg, level) {
        statusEl.textContent = msg || "";
        statusEl.classList.remove("error", "success");
        if (level) statusEl.classList.add(level);
      }

      function getFirstVisibleInput() {
        const fields = Array.from(document.querySelectorAll("input:not([disabled])"));
        return (
          fields.find((el) => {
            const s = window.getComputedStyle(el);
            return s.display !== "none" && s.visibility !== "hidden";
          }) || null
        );
      }

      function recoverInputFocus() {
        const target = getFirstVisibleInput();
        if (!target) return;
        try {
          target.focus();
        } catch (_) {}
      }

      // Desktop webview first-open: native dialogs can swallow the initial
      // focus, leaving the username field un-editable until the user clicks.
      // Retry a few times to hand focus to the first visible input — but
      // STOP as soon as the user interacts with the page. The previous
      // implementation re-stole focus on every pointerdown/click, which
      // prevented the user from clicking into the password field at all
      // (and incidentally tripped macOS's password-autofill popup).
      function installInputFocusRecovery() {
        let stopped = false;
        const stop = () => {
          if (stopped) return;
          stopped = true;
          clearInterval(timer);
          window.removeEventListener("pointerdown", stop, true);
          window.removeEventListener("keydown", stop, true);
        };
        // Any user interaction = they've taken over; don't fight them.
        window.addEventListener("pointerdown", stop, true);
        window.addEventListener("keydown", stop, true);

        let ticks = 0;
        const timer = setInterval(() => {
          ticks += 1;
          if (stopped) return;
          // Only seed focus while no input is yet focused — never override
          // a field the user (or autofill) has already picked.
          const active = document.activeElement;
          const isInputFocused =
            active &&
            (active.tagName === "INPUT" || active.tagName === "TEXTAREA");
          if (!isInputFocused) recoverInputFocus();
          if (ticks >= 6) stop(); // ~3 seconds is plenty for first paint
        }, 500);
      }

      function formatApiError(data) {
        const d = data && data.detail;
        if (!d) return "";
        if (typeof d === "string") return d;
        if (Array.isArray(d)) {
          return d
            .map((e) => (e && e.msg) || JSON.stringify(e))
            .join("；");
        }
        if (typeof d === "object") return d.msg || JSON.stringify(d);
        return String(d);
      }

      async function api(url, options) {
        const res = await fetch(url, {
          ...(options || {}),
          headers: {
            "Content-Type": "application/json",
            ...((options || {}).headers || {}),
          },
          credentials: "same-origin",
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(formatApiError(data) || `${t("请求失败")}（HTTP ${res.status}）`);
        return data;
      }

      async function bootstrap() {
        try {
          const s = await api("/api/auth/status");
          if (s.current_user) {
            // Already logged in — bounce to the home page.
            window.location.replace("/");
            return;
          }
          if (!s.initialized) {
            $("mode_setup").style.display = "block";
            recoverInputFocus();
          } else {
            $("mode_auth").style.display = "block";
            recoverInputFocus();
          }
        } catch (err) {
          setStatus(err.message || t("无法连接服务端"), "error");
        }
      }

      // Tab switching between login and register.
      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          document
            .querySelectorAll(".tab")
            .forEach((t) => t.classList.toggle("active", t === tab));
          const which = tab.dataset.tab;
          $("form_login").style.display = which === "login" ? "block" : "none";
          $("form_register").style.display = which === "register" ? "block" : "none";
          setStatus("");
          ($(`${which}_username`) || {}).focus?.();
        });
      });

      async function submitForm(formId, url, fieldPrefix, successMsg) {
        const form = $(formId);
        form.addEventListener("submit", async (ev) => {
          ev.preventDefault();
          setStatus("");
          const username = $(`${fieldPrefix}_username`).value.trim();
          const password = $(`${fieldPrefix}_password`).value;
          if (!username || !password) {
            setStatus(t("请填写用户名和密码"), "error");
            return;
          }
          const btn = form.querySelector("button");
          btn.disabled = true;
          const oldText = btn.textContent;
          btn.textContent = t("处理中…");
          try {
            await api(url, {
              method: "POST",
              body: JSON.stringify({ username, password }),
            });
            setStatus(successMsg, "success");
            // Tiny delay so the user sees the success line.
            setTimeout(() => window.location.replace("/"), 200);
          } catch (err) {
            setStatus(err.message, "error");
            btn.disabled = false;
            btn.textContent = oldText;
          }
        });
      }

      submitForm("form_setup", "/api/auth/setup", "setup", t("管理员已创建，正在进入…"));
      submitForm("form_login", "/api/auth/login", "login", t("登录成功，正在进入…"));
      submitForm(
        "form_register",
        "/api/auth/register",
        "register",
        t("注册成功，正在进入…")
      );

      // -------- forgot-password modal driver --------
      // Two-step flow. Step 1 sends username → server writes a code
      // to <data_dir>/.password_reset_challenge (0600). Step 2 asks
      // for the code + new password. See backend for security notes.
      const PwReset = (() => {
        let countdownTimer = null;
        let expiresAt = 0;

        function open() {
          const overlay = $("pw_reset_overlay");
          overlay.style.display = "flex";
          $("pw_reset_step1").style.display = "";
          $("pw_reset_step2").style.display = "none";
          $("pw_reset_status").textContent = "";
          $("pw_reset_status").className = "";
          const preset = ($("login_username").value || "").trim();
          if (preset) $("pw_reset_username").value = preset;
          setTimeout(() => $("pw_reset_username").focus(), 30);
        }

        function close() {
          const overlay = $("pw_reset_overlay");
          overlay.style.display = "none";
          $("pw_reset_status").textContent = "";
          $("pw_reset_code").value = "";
          $("pw_reset_new_pw").value = "";
          $("pw_reset_new_pw2").value = "";
          if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
        }

        function setPwStatus(msg, level) {
          const el = $("pw_reset_status");
          el.textContent = msg || "";
          el.style.color =
            level === "error" ? "#b91c1c" :
            level === "success" ? "#166534" : "#6b7280";
        }

        function startCountdown(seconds) {
          expiresAt = Date.now() + seconds * 1000;
          const cd = $("pw_reset_countdown");
          function tick() {
            const remaining = Math.max(0, Math.round((expiresAt - Date.now()) / 1000));
            const m = Math.floor(remaining / 60);
            const s = remaining % 60;
            cd.textContent = remaining > 0
              ? `⏱ 验证码剩余有效期 ${m}:${String(s).padStart(2, "0")}`
              : "⏱ 已过期,请重新申请";
            if (remaining <= 0 && countdownTimer) {
              clearInterval(countdownTimer);
              countdownTimer = null;
            }
          }
          tick();
          if (countdownTimer) clearInterval(countdownTimer);
          countdownTimer = setInterval(tick, 1000);
        }

        async function request() {
          const uname = ($("pw_reset_username").value || "").trim();
          if (!uname) {
            setPwStatus("请输入用户名", "error");
            return;
          }
          const btn = $("pw_reset_request_btn");
          btn.disabled = true;
          const old = btn.textContent;
          btn.textContent = "发送中…";
          setPwStatus("");
          try {
            const res = await api("/api/auth/password-reset/request", {
              method: "POST",
              body: JSON.stringify({ username: uname }),
            });
            $("pw_reset_step1").style.display = "none";
            $("pw_reset_step2").style.display = "";
            $("pw_reset_path_txt").textContent = res.challenge_path || "";
            startCountdown(Number(res.expires_in) || 300);
            setTimeout(() => $("pw_reset_code").focus(), 30);
          } catch (err) {
            setPwStatus(err.message || "请求失败", "error");
            btn.disabled = false;
            btn.textContent = old;
          } finally {
            if (btn.disabled) {
              btn.disabled = false;
              btn.textContent = old;
            }
          }
        }

        async function complete() {
          const uname = ($("pw_reset_username").value || "").trim();
          const code = ($("pw_reset_code").value || "").trim();
          const p1 = $("pw_reset_new_pw").value || "";
          const p2 = $("pw_reset_new_pw2").value || "";
          if (!code || code.length !== 6) {
            setPwStatus("请输入 6 位验证码", "error");
            return;
          }
          if (p1.length < 6) {
            setPwStatus("新密码至少 6 位", "error");
            return;
          }
          if (p1 !== p2) {
            setPwStatus("两次输入的新密码不一致", "error");
            return;
          }
          const btn = $("pw_reset_complete_btn");
          btn.disabled = true;
          const old = btn.textContent;
          btn.textContent = "重置中…";
          setPwStatus("");
          try {
            await api("/api/auth/password-reset/complete", {
              method: "POST",
              body: JSON.stringify({
                username: uname,
                code,
                new_password: p1,
              }),
            });
            setPwStatus("密码已重置,正在进入…", "success");
            setTimeout(() => window.location.replace("/"), 400);
          } catch (err) {
            setPwStatus(err.message || "重置失败", "error");
            btn.disabled = false;
            btn.textContent = old;
          }
        }

        async function copyPath() {
          const path = $("pw_reset_path_txt").textContent || "";
          try {
            await navigator.clipboard.writeText(path);
            setPwStatus("已复制路径到剪贴板", "success");
          } catch (_) {
            setPwStatus("无法访问剪贴板,请手动复制上方路径", "error");
          }
        }

        return { open, close, request, complete, copyPath };
      })();

      $("link_forgot").addEventListener("click", (ev) => {
        ev.preventDefault();
        PwReset.open();
      });
      $("pw_reset_cancel1").addEventListener("click", PwReset.close);
      $("pw_reset_cancel2").addEventListener("click", PwReset.close);
      $("pw_reset_request_btn").addEventListener("click", PwReset.request);
      $("pw_reset_complete_btn").addEventListener("click", PwReset.complete);
      $("pw_reset_copy_btn").addEventListener("click", PwReset.copyPath);
      // Enter-to-submit on the modal's active fields.
      $("pw_reset_username").addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); PwReset.request(); }
      });
      $("pw_reset_new_pw2").addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); PwReset.complete(); }
      });

      installInputFocusRecovery();
      bootstrap();
    </script>
  </body>
</html>
