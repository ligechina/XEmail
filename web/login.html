<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 · XEmail</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <style>
      :root {
        --bg: #f5f6f8;
        --surface: #ffffff;
        --surface-muted: #fafbfc;
        --border: #e4e6eb;
        --border-strong: #d4d7dd;
        --text: #1f2328;
        --text-muted: #6b7280;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --primary-soft: #e8efff;
        --danger: #dc2626;
        --success: #16a34a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        line-height: 1.5;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        width: 380px;
        max-width: calc(100vw - 32px);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 28px 26px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.06);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
      }
      .brand .logo {
        width: 32px;
        height: 32px;
        display: block;
        flex-shrink: 0;
      }
      .brand .name { font-weight: 600; font-size: 17px; }
      h1 {
        margin: 8px 0 4px;
        font-size: 18px;
      }
      .desc {
        margin: 0 0 18px;
        color: var(--text-muted);
        font-size: 12.5px;
      }
      .tabs {
        display: flex;
        gap: 4px;
        margin-bottom: 14px;
        background: var(--surface-muted);
        padding: 3px;
        border-radius: 6px;
      }
      .tab {
        flex: 1;
        text-align: center;
        padding: 6px 0;
        border-radius: 4px;
        cursor: pointer;
        color: var(--text-muted);
        user-select: none;
        font-size: 13px;
      }
      .tab.active {
        background: var(--surface);
        color: var(--text);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
      }
      .field { display: flex; flex-direction: column; margin-bottom: 12px; }
      .field label {
        font-size: 12px;
        color: var(--text-muted);
        margin-bottom: 4px;
      }
      .field input {
        padding: 9px 11px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font: inherit;
        background: var(--surface);
        color: var(--text);
      }
      .field input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--primary-soft);
      }
      .btn-primary {
        display: block;
        width: 100%;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid var(--primary);
        background: var(--primary);
        color: #fff;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
        margin-top: 4px;
      }
      .btn-primary:hover { background: var(--primary-hover); }
      .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
      .status {
        margin-top: 12px;
        min-height: 18px;
        font-size: 13px;
      }
      .status.error { color: var(--danger); }
      .status.success { color: var(--success); }
      .hint {
        margin-top: 14px;
        font-size: 12px;
        color: var(--text-muted);
        text-align: center;
      }
    </style>
    <script src="/i18n.js"></script>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <img class="logo" src="/logo.svg" alt="XEmail" />
        <div class="name">XEmail</div>
      </div>

      <div id="mode_setup" style="display: none">
        <h1>设置管理员</h1>
        <p class="desc">系统尚未初始化，请创建第一位管理员账号。该账号将拥有全部权限。</p>
        <form id="form_setup" autocomplete="off">
          <div class="field">
            <label for="setup_username">用户名</label>
            <input id="setup_username" required minlength="3" maxlength="32" />
          </div>
          <div class="field">
            <label for="setup_password">密码（至少 6 位）</label>
            <input id="setup_password" type="password" required minlength="6" />
          </div>
          <button class="btn-primary" type="submit">创建管理员</button>
        </form>
      </div>

      <div id="mode_auth" style="display: none">
        <div class="tabs">
          <div class="tab active" data-tab="login">登录</div>
          <div class="tab" data-tab="register">注册</div>
        </div>

        <form id="form_login" autocomplete="off">
          <div class="field">
            <label for="login_username">用户名</label>
            <input id="login_username" required />
          </div>
          <div class="field">
            <label for="login_password">密码</label>
            <input id="login_password" type="password" required />
          </div>
          <button class="btn-primary" type="submit">登录</button>
        </form>

        <form id="form_register" autocomplete="off" style="display: none">
          <div class="field">
            <label for="register_username">用户名（3–32 位）</label>
            <input id="register_username" required minlength="3" maxlength="32" />
          </div>
          <div class="field">
            <label for="register_password">密码（至少 6 位）</label>
            <input id="register_password" type="password" required minlength="6" />
          </div>
          <button class="btn-primary" type="submit">注册并登录</button>
        </form>
      </div>

      <div class="status" id="status"></div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const statusEl = $("status");

      function setStatus(msg, level) {
        statusEl.textContent = msg || "";
        statusEl.classList.remove("error", "success");
        if (level) statusEl.classList.add(level);
      }

      function getFirstVisibleInput() {
        const fields = Array.from(document.querySelectorAll("input:not([disabled])"));
        return (
          fields.find((el) => {
            const s = window.getComputedStyle(el);
            return s.display !== "none" && s.visibility !== "hidden";
          }) || null
        );
      }

      function recoverInputFocus() {
        const target = getFirstVisibleInput();
        if (!target) return;
        try {
          target.focus();
        } catch (_) {}
      }

      // Desktop webview first-open: native dialogs can swallow the initial
      // focus, leaving the username field un-editable until the user clicks.
      // Retry a few times to hand focus to the first visible input — but
      // STOP as soon as the user interacts with the page. The previous
      // implementation re-stole focus on every pointerdown/click, which
      // prevented the user from clicking into the password field at all
      // (and incidentally tripped macOS's password-autofill popup).
      function installInputFocusRecovery() {
        let stopped = false;
        const stop = () => {
          if (stopped) return;
          stopped = true;
          clearInterval(timer);
          window.removeEventListener("pointerdown", stop, true);
          window.removeEventListener("keydown", stop, true);
        };
        // Any user interaction = they've taken over; don't fight them.
        window.addEventListener("pointerdown", stop, true);
        window.addEventListener("keydown", stop, true);

        let ticks = 0;
        const timer = setInterval(() => {
          ticks += 1;
          if (stopped) return;
          // Only seed focus while no input is yet focused — never override
          // a field the user (or autofill) has already picked.
          const active = document.activeElement;
          const isInputFocused =
            active &&
            (active.tagName === "INPUT" || active.tagName === "TEXTAREA");
          if (!isInputFocused) recoverInputFocus();
          if (ticks >= 6) stop(); // ~3 seconds is plenty for first paint
        }, 500);
      }

      function formatApiError(data) {
        const d = data && data.detail;
        if (!d) return "";
        if (typeof d === "string") return d;
        if (Array.isArray(d)) {
          return d
            .map((e) => (e && e.msg) || JSON.stringify(e))
            .join("；");
        }
        if (typeof d === "object") return d.msg || JSON.stringify(d);
        return String(d);
      }

      async function api(url, options) {
        const res = await fetch(url, {
          ...(options || {}),
          headers: {
            "Content-Type": "application/json",
            ...((options || {}).headers || {}),
          },
          credentials: "same-origin",
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(formatApiError(data) || `${t("请求失败")}（HTTP ${res.status}）`);
        return data;
      }

      async function bootstrap() {
        try {
          const s = await api("/api/auth/status");
          if (s.current_user) {
            // Already logged in — bounce to the home page.
            window.location.replace("/");
            return;
          }
          if (!s.initialized) {
            $("mode_setup").style.display = "block";
            recoverInputFocus();
          } else {
            $("mode_auth").style.display = "block";
            recoverInputFocus();
          }
        } catch (err) {
          setStatus(err.message || t("无法连接服务端"), "error");
        }
      }

      // Tab switching between login and register.
      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          document
            .querySelectorAll(".tab")
            .forEach((t) => t.classList.toggle("active", t === tab));
          const which = tab.dataset.tab;
          $("form_login").style.display = which === "login" ? "block" : "none";
          $("form_register").style.display = which === "register" ? "block" : "none";
          setStatus("");
          ($(`${which}_username`) || {}).focus?.();
        });
      });

      async function submitForm(formId, url, fieldPrefix, successMsg) {
        const form = $(formId);
        form.addEventListener("submit", async (ev) => {
          ev.preventDefault();
          setStatus("");
          const username = $(`${fieldPrefix}_username`).value.trim();
          const password = $(`${fieldPrefix}_password`).value;
          if (!username || !password) {
            setStatus(t("请填写用户名和密码"), "error");
            return;
          }
          const btn = form.querySelector("button");
          btn.disabled = true;
          const oldText = btn.textContent;
          btn.textContent = t("处理中…");
          try {
            await api(url, {
              method: "POST",
              body: JSON.stringify({ username, password }),
            });
            setStatus(successMsg, "success");
            // Tiny delay so the user sees the success line.
            setTimeout(() => window.location.replace("/"), 200);
          } catch (err) {
            setStatus(err.message, "error");
            btn.disabled = false;
            btn.textContent = oldText;
          }
        });
      }

      submitForm("form_setup", "/api/auth/setup", "setup", t("管理员已创建，正在进入…"));
      submitForm("form_login", "/api/auth/login", "login", t("登录成功，正在进入…"));
      submitForm(
        "form_register",
        "/api/auth/register",
        "register",
        t("注册成功，正在进入…")
      );

      installInputFocusRecovery();
      bootstrap();
    </script>
  </body>
</html>
