<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="XEmail">
  <defs>
    <linearGradient id="xemailBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="xemailFlap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.65"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" ry="14" fill="url(#xemailBg)"/>
  <!-- envelope body -->
  <rect x="10" y="18" width="44" height="28" rx="4" ry="4"
        fill="rgba(255,255,255,0.10)" stroke="#ffffff" stroke-width="2.6"/>
  <!-- envelope flap forming the top half of an X -->
  <path d="M10.6 18.6 L32 34 L53.4 18.6"
        fill="url(#xemailFlap)" fill-opacity="0.35"
        stroke="#ffffff" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- bottom diagonals continue the X motif -->
  <path d="M10.6 45.4 L24 31 M53.4 45.4 L40 31"
        fill="none" stroke="#ffffff" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
